spring.datasource.url=jdbc:h2:mem:borrowing-service-test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
spring.cloud.consul.enabled=false
spring.cloud.consul.discovery.enabled=false
spring.cloud.service-registry.auto-registration.enabled=false
springwolf.enabled=false
axon.axonserver.enabled=false
axon.eventhandling.processors.borrowing-policies.mode=subscribing
axon.eventhandling.processors.borrowing-projections.mode=tracking
borrowing.limits.max-active-loans=5
borrowing.limits.max-unpaid-fees=3
borrowing.periods.regular-loan=P14D
borrowing.periods.extension=P14D
borrowing.fees.currency=USD
borrowing.fees.daily-late-rate=0.50
borrowing.fees.escalation-threshold-days=30
borrowing.fees.replacement-multiplier=1.00
borrowing.fees.money-scale=2
borrowing.fees.rounding-mode=HALF_UP
borrowing.fees.billable-time-zone=UTC
borrowing.fees.billable-day-rule=STARTED_24_HOUR_PERIODS
borrowing.bans.tier-1.damage-threshold=10
borrowing.bans.tier-1.duration=P1M
borrowing.bans.tier-2.damage-threshold=20
borrowing.bans.tier-2.duration=P3M
borrowing.bans.permanent.damage-threshold=30
