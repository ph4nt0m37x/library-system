spring.application.name=borrowing-service
axon.axonserver.enabled=false

# Server
server.port=${SERVER_PORT:8090}

# Borrowing policies. Values are configuration, not aggregate constants.
borrowing.limits.max-active-loans=5
borrowing.limits.max-unpaid-fees=3
borrowing.periods.regular-loan=P14D
borrowing.periods.extension=P14D
borrowing.fees.currency=USD
borrowing.fees.daily-late-rate=0.50
borrowing.fees.escalation-threshold-days=30
borrowing.fees.replacement-multiplier=1.00
borrowing.fees.money-scale=2
borrowing.fees.rounding-mode=HALF_UP
# Required decisions: no business value was supplied for either setting.
borrowing.fees.billable-time-zone=${BORROWING_FEES_BILLABLE_TIME_ZONE:}
borrowing.fees.billable-day-rule=${BORROWING_FEES_BILLABLE_DAY_RULE:}
borrowing.bans.tier-1.damage-threshold=10
borrowing.bans.tier-1.duration=P1M
borrowing.bans.tier-1.reason=Cumulative permanent-damage threshold reached
borrowing.bans.tier-2.damage-threshold=20
borrowing.bans.tier-2.duration=P3M
borrowing.bans.tier-2.reason=Second cumulative permanent-damage threshold reached
borrowing.bans.permanent.damage-threshold=30
borrowing.bans.permanent.reason=Permanent cumulative-damage threshold reached

# Policies are subscribing so Payment creation and the resulting local Fee settlements
# participate in the publishing command's local JPA transaction.
axon.eventhandling.processors.borrowing-policies.mode=subscribing
axon.eventhandling.processors.borrowing-projections.mode=tracking

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.acks=all
spring.kafka.consumer.group-id=borrowing-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.circuitbreaker.group.enabled=true
springwolf.enabled=true
springwolf.docket.base-package=com.borrowingservice
springwolf.docket.info.title=Borrowing Service
springwolf.docket.info.version=1.0.0
springwolf.docket.info.description=AsyncAPI docs for Kafka events published by borrowing service
springwolf.docket.servers.kafka.protocol=kafka
springwolf.docket.servers.kafka.host=${spring.kafka.bootstrap-servers}

# MYSQL
spring.datasource.url=jdbc:mysql://mysqldb:3306/borrowing_service_db
spring.datasource.username=user
spring.datasource.password=

# JPA/Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Consul service discovery
spring.cloud.consul.host=consul
spring.cloud.consul.port=8500
spring.cloud.consul.config.enabled=false
spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.discovery.service-name=${spring.application.name}
spring.cloud.consul.discovery.instance-id=${spring.application.name}-${random.value}
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=15s
spring.cloud.consul.discovery.register-health-check=true
spring.cloud.consul.discovery.port=${server.port}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
