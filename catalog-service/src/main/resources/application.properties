spring.application.name=catalog-service
axon.axonserver.enabled=false

# Server
server.port=${SERVER_PORT:8088}

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.acks=all
spring.kafka.consumer.group-id=catalog-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.circuitbreaker.group.enabled=true
springwolf.enabled=true
springwolf.docket.base-package=com.catalogservice
springwolf.docket.info.title=Catalog Service
springwolf.docket.info.version=1.0.0
springwolf.docket.info.description=AsyncAPI docs for Kafka events published by catalog service
springwolf.docket.servers.kafka.protocol=kafka
springwolf.docket.servers.kafka.host=${spring.kafka.bootstrap-servers}

# MYSQL
spring.datasource.url=jdbc:mysql://mysqldb:3306/catalog_service_db
spring.datasource.username=user
spring.datasource.password=

# JPA/Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Consul service discovery
spring.cloud.consul.host=consul
spring.cloud.consul.port=8500
spring.cloud.consul.config.enabled=false
spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.discovery.service-name=${spring.application.name}
spring.cloud.consul.discovery.instance-id=${spring.application.name}-${random.value}
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=15s
spring.cloud.consul.discovery.register-health-check=true
spring.cloud.consul.discovery.port=${server.port}

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always