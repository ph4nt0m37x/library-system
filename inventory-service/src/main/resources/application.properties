spring.application.name=inventory-service
axon.axonserver.enabled=false

# Server
server.port=${SERVER_PORT:8089}

# Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:broker:29092}
spring.kafka.producer.acks=all
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
# All loan listeners use this group. Changing it creates a new consumer group and,
# with auto-offset-reset=earliest, replays existing loan events for that new group.
spring.kafka.consumer.group-id=inventory-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.ack-mode=record
spring.jackson.deserialization.fail-on-unknown-properties=true

# Feign / Circuit Breaker
spring.cloud.openfeign.circuitbreaker.enabled=true
spring.cloud.openfeign.circuitbreaker.group.enabled=true
spring.cloud.openfeign.client.config.catalog-service.connect-timeout=2000
spring.cloud.openfeign.client.config.catalog-service.read-timeout=3000

# Springwolf
springwolf.enabled=true
springwolf.docket.base-package=com.inventoryservice
springwolf.docket.info.title=Inventory Service
springwolf.docket.info.version=1.0.0
springwolf.docket.info.description=AsyncAPI docs for Kafka events published by inventory service
springwolf.docket.servers.kafka.protocol=kafka
springwolf.docket.servers.kafka.host=${spring.kafka.bootstrap-servers}

# MYSQL
spring.datasource.url=jdbc:mysql://mysqldb:3306/inventory_service_db
spring.datasource.username=user
spring.datasource.password=password

# JPA/Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Consul service discovery
spring.cloud.consul.host=consul
spring.cloud.consul.port=8500
spring.cloud.consul.config.enabled=false
spring.cloud.consul.discovery.prefer-ip-address=false
spring.cloud.consul.discovery.hostname=inventory_service_app
spring.cloud.consul.discovery.service-name=${spring.application.name}
spring.cloud.consul.discovery.instance-id=${spring.application.name}-${random.value}
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=15s
spring.cloud.consul.discovery.register-health-check=true
spring.cloud.consul.discovery.port=${server.port}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
