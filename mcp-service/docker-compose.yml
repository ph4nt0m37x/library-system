services:
  mcp-service:
    build:
      context: .
    hostname: mcp-service
    container_name: mcp-service
    restart: unless-stopped
    expose:
      - "8091"
    environment:
      SERVER_PORT: 8091
      SPRING_CLOUD_CONSUL_HOST: ${SPRING_CLOUD_CONSUL_HOST:-consul}
      SPRING_CLOUD_CONSUL_PORT: ${SPRING_CLOUD_CONSUL_PORT:-8500}
      KEYCLOAK_ISSUER_URI: ${KEYCLOAK_ISSUER_URI:-http://localhost:8180/realms/library-system}
      KEYCLOAK_JWK_SET_URI: ${KEYCLOAK_JWK_SET_URI:-http://keycloak:8080/realms/library-system/protocol/openid-connect/certs}
      KEYCLOAK_AUDIENCE: ${KEYCLOAK_AUDIENCE:-library-api}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:6274}
      DOWNSTREAM_CONNECT_TIMEOUT_MS: ${DOWNSTREAM_CONNECT_TIMEOUT_MS:-2000}
      DOWNSTREAM_READ_TIMEOUT_MS: ${DOWNSTREAM_READ_TIMEOUT_MS:-5000}
    networks:
      - shared_net
    healthcheck:
      test: [ "CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://localhost:8091/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  shared_net:
    external: true
