services:
  api-gateway:
    build:
      context: .
    hostname: api-gateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      SERVER_PORT: 8000
      SPRING_CLOUD_CONSUL_HOST: consul
      SPRING_CLOUD_CONSUL_PORT: 8500
      GATEWAY_CORS_ALLOWED_ORIGINS: http://localhost:5173
    networks:
      - shared_net
    healthcheck:
      test: [ "CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "3", "http://localhost:8000/actuator/health" ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  shared_net:
    external: true
